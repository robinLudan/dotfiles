[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.79999998211860657
center = [ "group:g1" ]
end = [ "tray", "bar", "notifications", "network", "bluetooth", "battery", "session" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = false
smart_auto_hide = true
start = [ "workspaces" ]
thickness = 30

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "media" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 10

[battery]
warning_threshold = 20

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 400.0

[lockscreen]
blur_intensity = 0.19999999552965164
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
border = false

[osd]
border = false

    [osd.kinds]
    media = false

[plugin_settings."icefish/phone-connect"]
battery_display = "hidden"

[plugins]
enabled = [ "noctalia/translator", "icefish/phone-connect" ]

[shell]
password_style = "random"
polkit_agent = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    transparency_mode = "soft"

[theme]
community_palette = "Aura"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "niri" ]

[wallpaper]
transition_on_startup = true

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
max_length = 200

[widget.network]
show_label = false

[widget.volume]
enabled = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
show_labels = false
